version: 2

models:
  - name: mart_affordability_repayment
    description: >
      Cross-sectional mart combining affordability burden and repayment-history
      segment for portfolio risk analysis.

    columns:
      - name: AFFORDABILITY_SEGMENT
        data_tests:
          - not_null

      - name: REPAYMENT_SEGMENT
        data_tests:
          - not_null

      - name: APPLICANTS
        data_tests:
          - not_null

      - name: PCT_OF_TOTAL_APPLICANTS
        data_tests:
          - not_null